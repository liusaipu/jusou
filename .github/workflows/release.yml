name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macos
            asset_name: Jusou-macos.dmg
          - os: windows-latest
            target: windows
            asset_name: Jusou-windows.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build ${{ matrix.target }} --release

      - name: Package macOS DMG
        if: matrix.target == 'macos'
        run: |
          hdiutil create -volname Jusou \
            -srcfolder build/macos/Build/Products/Release/jusou.app \
            -ov -format UDZO Jusou-macos.dmg

      - name: Package Windows ZIP
        if: matrix.target == 'windows'
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath Jusou-windows.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: Jusou-${{ matrix.target }}.*
          body_path: ${{ matrix.target == 'macos' && 'RELEASE.md' || '' }}
